version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # 対応する最も古い Node.js（engines: >=22）に型定義を合わせる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 は typescript-eslint が未対応（peer: <6.1.0）
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
